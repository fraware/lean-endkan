[package]
name = "endkan"
version = "0.1.0"
edition = "2021"
description = "Practical Automation for Ends, Coends, and Kan Extensions in Lean 4"
authors = ["EndKan Team <team@endkan.dev>"]
license = "Apache-2.0"
repository = "https://github.com/fraware/lean-endkan"
homepage = "https://github.com/fraware/lean-endkan"
documentation = "https://github.com/fraware/lean-endkan/blob/main/README.md"
readme = "README.md"
keywords = [
    "lean",
    "category-theory",
    "mathematics",
    "formal-verification",
    "ends",
    "coends",
    "kan-extensions",
]
categories = ["development-tools", "mathematics", "science"]
rust-version = "1.70"

[dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["lean-ffi"]
lean-ffi = []

[[bin]]
name = "endkan"
path = "src/main.rs"

[lib]
name = "endkan"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# Package metadata for crates.io
[package.metadata.docs.rs]
features = ["lean-ffi"]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.cargo-machete]
ignored = [
    "tokio",
    "serde",
    "serde_json",
    "chrono",
    "rand",
    "clap",
    "tracing",
    "tracing-subscriber",
    "anyhow",
    "thiserror",
]
