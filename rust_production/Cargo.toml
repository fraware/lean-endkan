[package]
name = "endkan-production"
version = "0.1.0"
edition = "2021"
description = "High-performance production infrastructure for EndKan"
authors = ["EndKan Team"]
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["lean-ffi"]
lean-ffi = []

[[bin]]
name = "endkan-production"
path = "src/main.rs"
