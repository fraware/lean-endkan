name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/elan" default "$(cat lean-toolchain)"

      - name: Refresh dependencies
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build EndKan
        run: lake build EndKan

      - name: Executable smoke tests
        run: |
          lake exe test
          lake exe run_tests
          lake exe test-runner

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_production/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust_production/Cargo.lock') }}

      - name: Refresh security-sensitive lock entries
        working-directory: rust_production
        run: cargo update -p anyhow

      - name: Cargo fmt
        working-directory: rust_production
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust_production
        run: cargo clippy -- -D warnings

      - name: Tests
        working-directory: rust_production
        run: cargo test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Refresh security-sensitive lock entries
        working-directory: rust_production
        run: cargo update -p anyhow

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust_production

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Refresh security-sensitive lock entries
        working-directory: rust_production
        run: cargo update -p anyhow

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust_production/Cargo.toml
