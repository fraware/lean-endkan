name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build-args: EndKan

      - name: Build narrowed endBifunctor consumer
        shell: bash
        run: |
          set -o pipefail
          lake build Scratch.MathlibEndBifunctorConsumer 2>&1 | tee candidate-build.log

      - name: Upload narrowed consumer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narrowed-endbifunctor-build-log
          path: candidate-build.log

      - name: Executable smoke tests
        run: |
          lake exe test
          lake exe run_tests
          lake exe test-runner

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_production/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust_production/Cargo.lock') }}

      - name: Cargo fmt
        working-directory: rust_production
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust_production
        run: cargo clippy -- -D warnings

      - name: Tests
        working-directory: rust_production
        run: cargo test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust_production

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust_production/Cargo.toml
