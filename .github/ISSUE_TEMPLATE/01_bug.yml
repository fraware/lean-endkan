name: Bug report
description: Something is broken in the Lean library or tooling
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal Lean snippet, Lake version, Mathlib pin, and commands run (`lake build`, `lake exe …`, etc.).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
